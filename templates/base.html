<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canteen Management System</title>
    <link rel="shortcut icon" href="{{ url_for('static', filename='img/favicon.png') }}" type="">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    
    {% block extra_css %}{% endblock%}
</head>
<body>
    <div class="container">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="logo">
                <img src="{{ url_for('static', filename='img/logo.png') }}" alt="Canteen Logo">
            </div>
            
            <div class="sidebar-menu">
                <a href="{{ url_for('dashboard') }}" class="side-menu-item {% if active_page == 'dashboard' %}active{% endif %}">
                    <div class="menu-icon"><i class="fas fa-home"></i></div>
                    <div class="menu-text">Dashboard</div>
                </a>
                
                <a href="{{ url_for('user_menu')}}" class="side-menu-item {% if active_page == 'menu' %}active{% endif %}">
                    <div class="menu-icon"><i class="fas fa-clipboard-list"></i></div>
                    <div class="menu-text">Menu</div>
                </a>
                
                <a href="{{ url_for('orders') }}" class="side-menu-item {% if active_page == 'orders' %}active{% endif %}">
                    <div class="menu-icon"><i class="fas fa-receipt"></i></div>
                    <div class="menu-text">My Orders</div>
                </a>
                <a href="{{ url_for('cart')}}" class="side-menu-item {% if active_page == 'cart' %}active{% endif %}">
                    <div class="menu-icon"><i class="fas fa-shopping-cart"></i></div>
                    <div class="menu-text">Cart</div>
                </a>
                
                <a href="{{ url_for('transaction')}}" class="side-menu-item {% if active_page == 'transaction' %}active{% endif %}">
                    <div class="menu-icon"><i class="fas fa-history"></i></div>
                    <div class="menu-text">Transaction History</div>
                </a>
                
                <a href="{{ url_for('profile')}}" class="side-menu-item {% if active_page == 'profile' %}active{% endif %}">
                    <div class="menu-icon"><i class="fas fa-user"></i></div>
                    <div class="menu-text">Profile</div>
                </a>
                
                <a href="{{ url_for('logout') }}" class="side-menu-item {% if active_page == 'logout' %}active{% endif %}">
                    <div class="menu-icon"><i class="fas fa-sign-out-alt"></i></div>
                    <div class="menu-text">Logout</div>
                </a>
            </div>
        </div>
        
        <!-- Main Content -->
        <div class="main-content">
            <!-- Top Navigation -->
            <div class="top-nav">
            
                
                <div class="search-bar">
                    <input type="text" placeholder="Search everything here...">
                    <button type="submit"><i class="fas fa-search"></i></button>
                </div>
                
                <div class="user-menu">
                   
                    
                    <div class="notifications" onclick="toggleDropdown(); fetchNotifications();">
                        <i class="fas fa-bell"></i>
                        <span class="notif-badge" id="notif-badge">3</span>

                        <div class="notification-dropdown" id="notificationDropdown">
                            <!-- Notifications will be loaded here -->
                        </div>
                    </div>
                    
                    <div class="user-profile">
                        <div class="user-info">
                            <div class="user-name">{{ user.name }}</div>
                            <div class="user-email">{{ user.email }}</div>

                        </div>
                        <div class="user-avatar">
                            <img src="{{ url_for('static', filename='img/user.png') }}" alt="User Avatar">
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- Page Content -->
            <div class="page-content">
                {% block content %}{% endblock %}
            </div>
            
            <!-- Footer -->
            <div class="footer">
                <p>© Copyright 2025. All Right Reserved.</p>
                <p>Software Version: 1.0.0</p>
            </div>
        </div>
    </div>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>

{% extends "base.html" %}
{% block extra_css %}
<style>
    #cart .cart-container {
    display: grid;
    grid-template-columns: 2fr 1fr;
    gap: 25px;
}

#cart .cart-items {
    background-color: var(--white);
    border-radius: 12px;
    padding: 20px;
    box-shadow: var(--shadow);
}

#cart .cart-item {
    display: flex;
    padding: 15px 0;
    border-bottom: 1px solid var(--border-color);
}

#cart .cart-item-img {
    width: 70px;
    height: 70px;
    border-radius: 8px;
    object-fit: cover;
    margin-right: 15px;
}

#cart .cart-item-info {
    flex: 1;
}

#cart .cart-item-title {
    font-size: 16px;
    font-weight: 600;
    color: var(--text-dark);
    margin-bottom: 5px;
}

#cart .cart-item-price {
    font-size: 15px;
    color: var(--primary-color);
    font-weight: 500;
}

#cart .cart-item-actions {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 20px;
}

#cart .quantity-control {
    display: flex;
    align-items: center;
}

#cart .quantity-btn {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    border: 1px solid var(--border-color);
    background: none;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    cursor: pointer;
    transition: var(--transition);
}

#cart .quantity-btn:hover {
    background-color: rgba(240, 109, 40, 0.1);
}

#cart .quantity-value {
    margin: 0 10px;
    font-size: 14px;
    color: var(--text-dark);
    min-width: 20px;
    text-align: center;
}

#cart .remove-item {
    color: #ff4d4d;
    background: none;
    border: none;
    cursor: pointer;
    font-size: 18px;
}

#cart .cart-summary {
    background-color: var(--white);
    border-radius: 12px;
    padding: 20px;
    box-shadow: var(--shadow);
    position: sticky;
    top: 25px;
}

#cart .summary-line {
    display: flex;
    justify-content: space-between;
    padding: 12px 0;
    color: var(--text-light);
    font-size: 14px;
}

#cart .summary-line.total {
    border-top: 1px solid var(--border-color);
    margin-top: 10px;
    padding-top: 15px;
    font-size: 18px;
    font-weight: 600;
    color: var(--text-dark);
}

#cart .checkout-btn {
    display: block;
    width: 100%;
    padding: 12px;
    background-color: var(--primary-color);
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    font-weight: 500;
    cursor: pointer;
    margin-top: 20px;
    transition: var(--transition);
}

#cart .checkout-btn:hover {
    background-color: #e55f1e;
}

</style>
{% endblock %}
{% block content %}
<div id="cart" class="page">
    <div class="cart-container">
        <div class="cart-items">
            <div class="section-header">
                <h2 class="section-title">Your Cart (3)</h2>
            </div>
            
            <div class="cart-item">
                <img src="/api/placeholder/70/70" alt="Classic Burger" class="cart-item-img">
                <div class="cart-item-info">
                    <h3 class="cart-item-title">Classic Burger</h3>
                    <p class="cart-item-price">$10.99</p>
                </div>
                <div class="cart-item-actions">
                    <div class="quantity-control">
                        <button class="quantity-btn">-</button>
                        <span class="quantity-value">1</span>
                        <button class="quantity-btn">+</button>
                    </div>
                    <button class="remove-item"><i class="fas fa-trash"></i></button>
                </div>
            </div>
            <div class="cart-item">
                <img src="/api/placeholder/70/70" alt="French Fries" class="cart-item-img">
                <div class="cart-item-info">
                    <h3 class="cart-item-title">French Fries</h3>
                    <p class="cart-item-price">$4.00</p>
                </div>
                <div class="cart-item-actions">
                    <div class="quantity-control">
                        <button class="quantity-btn">-</button>
                        <span class="quantity-value">1</span>
                        <button class="quantity-btn">+</button>
                    </div>
                    <button class="remove-item"><i class="fas fa-trash"></i></button>
                </div>
            </div>
            <div class="cart-item">
                <img src="/api/placeholder/70/70" alt="Coke" class="cart-item-img">
                <div class="cart-item-info">
                    <h3 class="cart-item-title">Coke</h3>
                    <p class="cart-item-price">$3.00</p>
                </div>
                <div class="cart-item-actions">
                    <div class="quantity-control">
                        <button class="quantity-btn">-</button>
                        <span class="quantity-value">2</span>
                        <button class="quantity-btn">+</button>
                    </div>
                    <button class="remove-item"><i class="fas fa-trash"></i></button>
                </div>
            </div>
        </div>
        <div class="cart-summary">
            <h2 class="section-title">Order Summary</h2>
            <div class="summary-line">
                <span>Subtotal</span>
                <span>$20.99</span>
            </div>
            <div class="summary-line">
                <span>Tax</span>
                <span>$1.68</span>
            </div>
            <div class="summary-line">
                <span>Service Fee</span>
                <span>$0.50</span>
            </div>
            <div class="summary-line total">
                <span>Total</span>
                <span>$23.17</span>
            </div>
            <button class="checkout-btn">Proceed to Checkout</button>
        </div>
    </div>
</div>
{% endblock %}

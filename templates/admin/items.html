{% extends "admin/admin_base.html" %}
{% block content %}
 <main class="content">
     <div class="action-bar">
            <button class="add-btn" id="addUnitBtn">
                <i class="fas fa-plus"></i> Add Unit
            </button>
            <div class="search-box">
                <input type="text" placeholder="Search units...">
                <button><i class="fas fa-search"></i></button>
            </div>
        </div>
    <section class="data-table-container">
        <table class="data-table">
            <thead>
                <tr>
                    <th>Item ID</th>
                    <th>Name</th>
                    <th>Category</th>
                    <th>Price</th>
                    <th>Available</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="item-table-body">
                <tr>
                    <td>001</td>
                    <td>Chicken Sandwich</td>
                    <td>Sandwiches</td>
                    <td>$5.99</td>
                    <td><span class="status available">Yes</span></td>
                    <td class="actions">
                        <button class="btn-edit"><i class="fas fa-edit"></i></button>
                            <button class="btn-delete"><i class="fas fa-trash"></i></button>
                    </td>
                </tr>
                <tr>
                    <td>002</td>
                    <td>Caesar Salad</td>
                    <td>Salads</td>
                    <td>$4.50</td>
                    <td><span class="status available">Yes</span></td>
                    <td class="actions">
                        <button class="btn-edit"><i class="fas fa-edit"></i></button>
                            <button class="btn-delete"><i class="fas fa-trash"></i></button>
                    </td>
                </tr>
                <tr>
                    <td>003</td>
                    <td>Pepperoni Pizza</td>
                    <td>Hot Meals</td>
                    <td>$8.99</td>
                    <td><span class="status not-available">No</span></td>
                    <td class="actions">
                        <button class="btn-edit"><i class="fas fa-edit"></i></button>
                            <button class="btn-delete"><i class="fas fa-trash"></i></button>
                    </td>
                </tr>
            </tbody>
        </table>
    </section>
    <div id="item-modal" class="modal">
        <div class="modal-content">
            <span class="close" style="font-size: 32px; font-weight: bold; cursor: pointer;">&times;</span>

            <h2 id="modal-title">Add New Item</h2>
            <form id="item-form">
                <div class="form-group">
                    <label for="item-name">Item Name</label>
                    <input type="text" id="item-name" required>
                </div>
                <div class="form-group">
                    <label for="item-category">Category</label>
                    <select id="item-category" required>
                        <option value="">Select Category</option>
                        <option value="Sandwiches">Sandwiches</option>
                        <option value="Salads">Salads</option>
                        <option value="Hot Meals">Hot Meals</option>
                        <option value="Beverages">Beverages</option>
                        <option value="Desserts">Desserts</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="item-price">Price ($)</label>
                    <input type="number" id="item-price" step="0.01" min="0" required>
                </div>
                <div class="form-group">
                    <label for="item-description">Description</label>
                    <textarea id="item-description" rows="3"></textarea>
                </div>
                <div class="form-group checkbox">
                    <label for="item-available">
                        <input type="checkbox" id="item-available" checked>
                        Available
                    </label>
                </div>
                <div class="form-group file-upload">
                    <label for="item-image">Image</label>
                    <input type="file" id="item-image" accept="image/*">
                </div>
                <div class="form-actions">
                    <button type="button" class="cancel-btn">Cancel</button>
                    <button type="submit" class="save-btn">Save Item</button>
                </div>
            </form>
        </div>
    </div>
</main>
{% endblock%}
{% block extra_js %}
    <script src="{{ url_for('static',filename='js/item.js') }}"></script>
{% endblock %}

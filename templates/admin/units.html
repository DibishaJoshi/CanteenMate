{% extends "admin/admin_base.html" %}
{% block content %}
 <main class="content">
    <div class="units-content">
        <div class="action-bar">
            <button class="add-btn" id="addUnitBtn">
                <i class="fas fa-plus"></i> Add Unit
            </button>
            <div class="search-box">
                <input type="text" placeholder="Search units...">
                <button><i class="fas fa-search"></i></button>
            </div>
        </div>
        <div class="units-list">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Unit Name</th>
                        <th>Short Name</th>
                        <th>Applied Items</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>1</td>
                        <td>Kilogram</td>
                        <td>kg</td>
                        <td>22</td>
                        <td><span class="status active">Active</span></td>
                        <td class="actions">
                           <button class="btn-edit"><i class="fas fa-edit"></i></button>
                            <button class="btn-delete"><i class="fas fa-trash"></i></button>
                        </td>
                    </tr>
                    <tr>
                        <td>2</td>
                        <td>Gram</td>
                        <td>g</td>
                        <td>35</td>
                        <td><span class="status active">Active</span></td>
                        <td class="actions">
                            <button class="btn-edit"><i class="fas fa-edit"></i></button>
                            <button class="btn-delete"><i class="fas fa-trash"></i></button>
                        </td>
                    </tr>
                    <tr>
                        <td>3</td>
                        <td>Liter</td>
                        <td>L</td>
                        <td>18</td>
                        <td><span class="status active">Active</span></td>
                        <td class="actions">
                            <button class="btn-edit"><i class="fas fa-edit"></i></button>
                            <button class="btn-delete"><i class="fas fa-trash"></i></button>
                        </td>
                    </tr>
                    <tr>
                        <td>4</td>
                        <td>Milliliter</td>
                        <td>ml</td>
                        <td>24</td>
                        <td><span class="status active">Active</span></td>
                        <td class="actions">
                            <button class="btn-edit"><i class="fas fa-edit"></i></button>
                            <button class="btn-delete"><i class="fas fa-trash"></i></button>
                        </td>
                    </tr>
                    <tr>
                        <td>5</td>
                        <td>Piece</td>
                        <td>pc</td>
                        <td>42</td>
                        <td><span class="status active">Active</span></td>
                        <td class="actions">
                           <button class="btn-edit"><i class="fas fa-edit"></i></button>
                            <button class="btn-delete"><i class="fas fa-trash"></i></button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
        <div class="pagination">
            <button class="btn-page"><i class="icon-chevron-left"></i></button>
            <button class="btn-page active">1</button>
            <button class="btn-page">2</button>
            <button class="btn-page">3</button>
            <button class="btn-page"><i class="icon-chevron-right"></i></button>
        </div>
    </div>
</main>
   

    <!-- Modal for adding/editing unit -->
    <div class="modal" id="unitModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Add Unit</h2>
                <button class="close-btn">&times;</button>
            </div>
            <div class="modal-body">
                <form id="unitForm">
                    <div class="form-group">
                        <label for="unitName">Unit Name</label>
                        <input type="text" id="unitName" required>
                    </div>
                    <div class="form-group">
                        <label for="unitShortName">Short Name</label>
                        <input type="text" id="unitShortName" required>
                    </div>
                    <div class="form-group">
                        <label>Status</label>
                        <div class="radio-group">
                            <label>
                                <input type="radio" name="status" value="active" checked> Active
                            </label>
                            <label>
                                <input type="radio" name="status" value="inactive"> Inactive
                            </label>
                        </div>
                    </div>
                    <div class="form-actions">
                        <button type="button" class="btn-secondary" id="cancelBtn">Cancel</button>
                        <button type="submit" class="btn-primary">Save</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
{% block extra_js %}
    <script src="{{ url_for('static', filename='js/units.js') }}"></script>
{% endblock %}
{% endblock %}
